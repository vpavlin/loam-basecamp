# Build Basecamp modules for another platform on a GitHub runner — macOS Apple Silicon (macos-14)
# or Linux ARM64 (ubuntu-24.04-arm) — so the Linux x86_64 packages we publish can be merged into
# multi-platform .lgx files (`lgx merge`).
#
# Each line of `modules` is `name=flakeref [extra nix args]` (pin commits for reproducible packages;
# extra args e.g. `--override-input keycard github:…` to build against a patched dependency). One module
# failing doesn't stop the rest: the summary says OK/FAILED per module, every build log's tail is
# uploaded, and the built .lgx files land in the `macos-lgx` artifact.
#
#   gh workflow run macos-modules.yml --repo vpavlin/loam-basecamp            # the default list, macOS
#   gh workflow run macos-modules.yml --repo vpavlin/loam-basecamp -f runner=ubuntu-24.04-arm
#   gh workflow run macos-modules.yml --repo vpavlin/loam-basecamp -f modules="$(cat list.txt)"
name: Platform modules

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub runner: macos-14 (darwin-arm64) or ubuntu-24.04-arm (linux-arm64)"
        required: false
        default: macos-14
      modules:
        description: "name=flakeref, one per line (empty = the Scala chain below)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 360
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            accept-flake-config = true
      - name: Build modules
        shell: bash
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          set -u -o pipefail
          if [ -z "$MODULES" ]; then MODULES=$(cat <<'LIST'
          delivery_module=github:vpavlin/logos-delivery-module/7d93aeb9382ffdf2025e3d7835427420fc23cbb2
          storage_module=github:logos-co/logos-storage-module/bcc29f05e2a7b4a2d215d09640aaa7436359906b
          keycard=github:vpavlin/keycard-basecamp/27c0cdf3d9d7967c34a65386e4ecaa93803646fb
          keycard-ui=github:vpavlin/keycard-basecamp/a3f87be389d5ba977651ce401d8c6e57fd306f5e?dir=keycard-ui
          ble_mesh=github:vpavlin/loam-basecamp/fc8ec6d52c9562ee197158d31b54597d2e6bccc8?dir=ble_mesh
          loam_core=github:vpavlin/loam-basecamp/fc8ec6d52c9562ee197158d31b54597d2e6bccc8?dir=core --override-input keycard github:vpavlin/keycard-basecamp/27c0cdf3d9d7967c34a65386e4ecaa93803646fb
          scala=github:vpavlin/scala/541bde522cde9b324f926fe4e7e7718b419beca5
          scala_ui=github:vpavlin/scala/541bde522cde9b324f926fe4e7e7718b419beca5?dir=scala-ui
          LIST
          ); fi
          mkdir -p out logs; : > out/summary.txt
          while IFS='=' read -r name rest; do
            # rest = "<flakeref> [extra nix args, e.g. --override-input keycard github:…]"
            name=$(echo "$name" | xargs); ref=$(echo "$rest" | awk '{print $1}'); extra=$(echo "$rest" | awk '{$1=""; print}' | xargs)
            [ -n "$name" ] || continue
            echo "::group::$name ($ref)"
            start=$(date +%s)
            # shellcheck disable=SC2086
            if nix build --accept-flake-config "${ref}#lgx-portable" $extra -o "res-$name" > "logs/$name.log" 2>&1; then
              cp res-$name/*.lgx "out/$name.lgx"
              echo "$name OK ($(( $(date +%s) - start ))s)" | tee -a out/summary.txt
            else
              echo "$name FAILED ($(( $(date +%s) - start ))s)" | tee -a out/summary.txt
              tail -60 "logs/$name.log"
            fi
            echo "::endgroup::"
          done <<< "$MODULES"
          echo "== summary"; cat out/summary.txt
          for f in logs/*.log; do tail -200 "$f" > "$f.tail"; done
      - uses: actions/upload-artifact@v4
        with:
          name: lgx-${{ inputs.runner || 'macos-14' }}
          path: |
            out/
            logs/*.tail
